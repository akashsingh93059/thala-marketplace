                            <Pagination page={page} setPage={setPage} totalPages={pages} total={total}/>
                        </>
                    )}
                    {selected && (
                        <ShopDetailModal shop={selected} user={user}
                            onClose={() => setSelected(null)}
                            setError={setError} setSuccess={setSuccess} setLoading={setLoading}
                            openChatWith={openChatWith} staffList={staffList} onChanged={onChanged}/>
                    )}
                </div>
            );
        }

        function ShopCard({ shop, onOpen, viewerIsStaff }) {
            const catLabel = {'street-food':'Street Food','fruits-raw':'Fresh Fruits','tiffin':'Tiffin'}[shop.category] || shop.category;
            const catEmoji = {'street-food':'🍡','fruits-raw':'🍎','tiffin':'🥘'}[shop.category] || '🏪';
            const isOpen = shop.isOnline !== false;
            return (
                <div className="card cursor-pointer fade-in" onClick={onOpen}>
                    <div className="shop-img">
                        <img src={imageUrl(shop.image) || `https://via.placeholder.com/400x220?text=${catEmoji}`} alt={shop.name}
                             onError={e => { e.target.src = `https://via.placeholder.com/400x220?text=${catEmoji}`; }}/>
                        <div className="img-overlay"/>
                        <div className="img-top">
                            <span className="badge bg-indigo-600 text-white">{catEmoji} {catLabel}</span>
                            {shop.shopperId && <span className="badge bg-white/90 text-indigo-700 font-mono" style={{fontSize:'.62rem'}}>{shop.shopperId}</span>}
                        </div>
                        <div className="img-bottom flex items-center justify-between">
                            <span className="rating-pill">★ {(shop.rating||0).toFixed(1)} <span style={{opacity:.75}}>({shop.reviewCount||0})</span></span>
                            <span className="flex items-center gap-1 text-white text-xs font-medium">
                                {isOpen ? <span className="dot-on"/> : <span className="dot-off"/>}
                                {isOpen ? 'Open' : 'Closed'}
                            </span>
                        </div>
                    </div>
                    <div className="p-4">
                        <h3 className="font-bold text-base truncate mb-1" style={{color:'var(--t1)'}}>{shop.name}</h3>
                        <p className="line-clamp-2 text-sm mb-3" style={{color:'var(--t2)'}}>{shop.description}</p>
                        <div className="flex items-center justify-between">
                            <span className="flex items-center gap-1 text-xs" style={{color:'var(--t3)'}}>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                {shop.location}
                            </span>
                            {viewerIsStaff && shop.mobile && <span className="text-xs font-medium" style={{color:'var(--a)'}}>📞 {shop.mobile}</span>}
                        </div>
                    </div>
                </div>
            );
        }

        function ShopDetailModal({ shop, user, onClose, setError, setSuccess, setLoading, openChatWith, staffList, onChanged }) {
            const [reviews, setReviews] = useState([]);
            const [myRating, setMyRating] = useState(0);
            const [myComment, setMyComment] = useState('');
            const [busy, setBusy] = useState(false);
            const [replyingTo, setReplyingTo] = useState(null);
            const [replyBody, setReplyBody] = useState('');

            useEffect(() => {
                const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onEsc);
                return () => document.removeEventListener('keydown', onEsc);
            }, [onClose]);

            const fetchReviews = useCallback(() => {
                api.get(`/shops/${shop._id}/reviews`)
                    .then(r => {
                        setReviews(r.data);
                        if (user) {
                            const mine = r.data.find(x => x.userEmail === user.email);
                            if (mine) { setMyRating(mine.rating); setMyComment(mine.comment || ''); }
                        }
                    })
                    .catch(() => {});
            }, [shop._id, user]);
            useEffect(() => { fetchReviews(); }, [fetchReviews]);

            const submitReview = async (e) => {
                e.preventDefault();
                if (!user) { setError('Please login to review'); return; }
                if (user.isStaff) { setError("Staff don't post reviews"); return; }
                if (myRating < 1) { setError('Pick a rating from 1 to 5 stars'); return; }
                setBusy(true);
                try {
                    await api.post(`/shops/${shop._id}/reviews`, { rating: myRating, comment: myComment });
                    setSuccess('Review saved');
                    fetchReviews();
                    onChanged?.();
                } catch (err) { setError(errMsg(err)); }
                finally { setBusy(false); }
            };

            const deleteMyReview = async () => {
                if (!window.confirm('Delete your review?')) return;
                setBusy(true);
                try {
                    await api.delete(`/shops/${shop._id}/reviews/me`);
                    setMyRating(0); setMyComment('');
                    setSuccess('Review removed');
                    fetchReviews(); onChanged?.();
                } catch (err) { setError(errMsg(err)); }
                finally { setBusy(false); }
            };

            const messageStaff = () => {
                const r = staffList.find(s => s.isAdmin) || staffList[0];
                if (!r) { setError('No staff available'); return; }
                openChatWith(r.email, { name: r.name });
                onClose();
            };

            const isOwn = user && shop.userId === user.email;

            const [hofEntries, setHofEntries] = useState([]);
            const [showBookingForm, setShowBookingForm] = useState(false);
            const [showHofForm, setShowHofForm] = useState(false);

            useEffect(() => {
                api.get('/hall-of-fame', { params: { shopId: shop._id, limit: 50 } })
                    .then(r => setHofEntries(r.data?.data || []))
                    .catch(() => {});
            }, [shop._id]);

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 p-4" onClick={onClose}>
                    <div className="bg-white p-6 sm:p-8 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                        <div className="flex justify-between items-start mb-3">
                            <div>
                                <h2 className="text-2xl font-bold">{shop.name}</h2>
                                {shop.shopperId && <p className="text-xs text-indigo-600 font-mono">{shop.shopperId}</p>}
                                <div className="mt-1 flex items-center gap-2">
                                    <Stars value={shop.rating || 0} size="md"/>
                                    <span className="text-sm text-gray-500">{(shop.rating || 0).toFixed(1)} · {shop.reviewCount || 0} review{shop.reviewCount === 1 ? '' : 's'}</span>
                                </div>
                            </div>
                            <span className="badge bg-indigo-600 text-white capitalize">{shop.category}</span>
                        </div>
                        <img src={imageUrl(shop.image) || 'https://via.placeholder.com/400x250'} alt="" className="w-full h-48 object-cover mb-4 rounded"
                             onError={e => { e.target.src = 'https://via.placeholder.com/400x250'; }}/>
                        <p className="text-gray-700 mb-3 whitespace-pre-line">{shop.description}</p>
                        <p><span className="font-medium">Area:</span> {shop.location}</p>
                        {shop.address && <p><span className="font-medium">Address:</span> {shop.address}</p>}
                        {shop.mobile && (
                            <p className="mt-2 inline-flex items-center gap-2 bg-orange-50 border border-orange-200 text-orange-800 px-3 py-1.5 rounded-md font-medium text-sm">
                                <span>📞 Owner's phone:</span>
                                <a href={`tel:${shop.mobile.replace(/[^0-9+]/g,'')}`} className="font-mono">{shop.mobile}</a>
                                <a href={`https://wa.me/${shop.mobile.replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" className="text-green-700 hover:underline text-xs">WhatsApp</a>
                            </p>
                        )}

                        {shop.lat != null && shop.lng != null && (
                            <div className="mt-4">
                                <MapView lat={shop.lat} lng={shop.lng} name={shop.name}/>
                            </div>
                        )}

                        <div className="flex gap-2 flex-wrap mt-4">
                            {!user?.isStaff && !isOwn && user && (
                                <button onClick={() => setShowBookingForm(s => !s)} className="btn-accent px-4 py-2 rounded-md text-sm">
                                    {showBookingForm ? 'Cancel booking' : '🙋 Book a work-day'}
                                </button>
                            )}
                            {(isOwn || user?.isAdmin) && (
                                <button onClick={() => setShowHofForm(s => !s)} className="btn-primary px-4 py-2 rounded-md text-sm">
                                    {showHofForm ? 'Cancel' : '🏆 Add Hall of Fame'}
                                </button>
                            )}
                            {!user?.isStaff && !isOwn && (
                                <button onClick={messageStaff} className="bg-gray-200 text-gray-800 px-4 py-2 rounded-md text-sm">Message DIVI staff</button>
                            )}
                        </div>

                        {showBookingForm && user && (
                            <div className="mt-4">
                                <BookingForm shop={shop} user={user} onSuccess={() => setShowBookingForm(false)} onCancel={() => setShowBookingForm(false)} setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>
                            </div>
                        )}

                        {showHofForm && (isOwn || user?.isAdmin) && (
                            <div className="mt-4">
                                <HoFForm shop={shop} onSuccess={() => { setShowHofForm(false); api.get('/hall-of-fame', { params: { shopId: shop._id } }).then(r => setHofEntries(r.data?.data || [])); }} onCancel={() => setShowHofForm(false)} setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>
                            </div>
                        )}

                        {/* Hall of Fame */}
                        <div className="mt-6 border-t pt-4">
                            <h3 className="font-semibold mb-3">🏆 Hall of Fame ({hofEntries.length})</h3>
                            {hofEntries.length === 0 ? <p className="text-sm text-gray-500">No one has worked here yet — be the first to book a day.</p> : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {hofEntries.map(h => (
                                        <div key={h._id} className="bg-gradient-to-br from-indigo-50 to-orange-50 rounded-lg p-3 border border-indigo-100">
                                            {h.image && <img src={imageUrl(h.image)} alt={h.personName} className="w-full h-28 object-cover rounded mb-2" onError={e => e.target.style.display = 'none'}/>}
                                            <p className="font-semibold text-sm">{h.personName}</p>
                                            {(h.workedFrom || h.workedTo) && <p className="text-xs text-gray-500">{h.workedFrom ? new Date(h.workedFrom).toLocaleDateString() : ''}{h.workedTo ? ' → ' + new Date(h.workedTo).toLocaleDateString() : ''}</p>}
                                            <p className="text-sm text-gray-700 mt-1 whitespace-pre-line">{h.description}</p>
                                            {(h.soldAmount || h.earnedAmount) && (
                                                <p className="text-xs text-orange-600 mt-1 font-medium">
                                                    {h.soldAmount ? `Sold ₹${h.soldAmount}` : ''}{h.soldAmount && h.earnedAmount ? ' · ' : ''}{h.earnedAmount ? `Earned ₹${h.earnedAmount}` : ''}
                                                </p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Review form */}
                        {user && !user.isStaff && !isOwn && (
                            <div className="mt-6 border-t pt-4">
                                <h3 className="font-semibold mb-2">Your review</h3>
                                <form onSubmit={submitReview}>
                                    <div className="flex gap-1 mb-3 text-3xl">
                                        {[1,2,3,4,5].map(n => (
                                            <button type="button" key={n} onClick={() => setMyRating(n)}
                                                    className={n <= myRating ? 'star' : 'star-empty'}>★</button>
                                        ))}
                                    </div>
                                    <textarea value={myComment} onChange={e=>setMyComment(e.target.value)} maxLength={1000} rows={3}
                                              placeholder="Share your experience..." className="w-full px-3 py-2 border border-gray-300 rounded-md mb-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                    <div className="flex gap-2">
                                        <button type="submit" disabled={busy} className="btn-primary px-4 py-2 rounded-md disabled:opacity-60">
                                            {busy ? 'Saving...' : reviews.find(r => r.userEmail === user.email) ? 'Update review' : 'Submit review'}
                                        </button>
                                        {reviews.find(r => r.userEmail === user.email) && (
                                            <button type="button" onClick={deleteMyReview} className="bg-red-100 text-red-700 px-4 py-2 rounded-md text-sm">Delete review</button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* Reviews list */}
                        <div className="mt-6 border-t pt-4">
                            <h3 className="font-semibold mb-3">Reviews ({reviews.length})</h3>
                            {reviews.length === 0 ? <p className="text-sm text-gray-500">Be the first to review</p> : (
                                <ul className="space-y-3">
                                    {reviews.map(r => (
                                        <li key={r._id} className="border-l-2 border-indigo-200 pl-3">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="font-medium text-sm">{r.userName}</span>
                                                <Stars value={r.rating}/>
                                                <span className="text-xs text-gray-400">{new Date(r.createdAt).toLocaleDateString()}</span>
                                                {user?.isAdmin && (
                                                    <button onClick={async () => {
                                                        if (!window.confirm('Delete this review?')) return;
                                                        try { await api.delete(`/admin/reviews/${r._id}`); setSuccess('Review removed'); fetchReviews(); }
                                                        catch (err) { setError(errMsg(err)); }
                                                    }} className="ml-auto text-red-600 hover:underline text-xs">Delete</button>
                                                )}
                                            </div>
                                            {r.comment && <p className="text-sm text-gray-700 mt-1 whitespace-pre-line">{r.comment}</p>}
                                            <div className="flex gap-4 mt-2 items-center">
                                                <button onClick={async () => {
                                                    try { const res = await api.patch(`/shops/${shop._id}/reviews/${r._id}/like`); fetchReviews(); }
                                                    catch (err) { setError(errMsg(err)); }
                                                }} className={`text-xs flex items-center gap-1 ${(r.likes||[]).includes(user?.email) ? 'text-indigo-600 font-bold' : 'text-gray-500'}`}>
                                                    👍 { (r.likes||[]).length || 0 }
                                                </button>
                                                <button onClick={() => setReplyingTo(replyingTo === r._id ? null : r._id)} className="text-xs text-indigo-600 hover:underline">
                                                    💬 Reply
                                                </button>
                                            </div>

                                            {/* Replies list */}
                                            { (r.replies||[]).length > 0 && (
                                                <div className="mt-2 ml-4 space-y-2 border-l-2 border-gray-100 pl-3">
                                                    {r.replies.map((rp, i) => (
                                                        <div key={i} className="text-xs">
                                                            <span className="font-semibold text-gray-800">{rp.name}:</span>
                                                            <span className="text-gray-600 ml-1">{rp.body}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}

                                            {/* Reply input */}
                                            { replyingTo === r._id && (
                                                <div className="mt-2 ml-4 flex gap-2">
                                                    <input value={replyBody} onChange={e=>setReplyBody(e.target.value)} placeholder="Write a reply..." className="flex-1 px-2 py-1 border border-gray-200 rounded text-xs focus:outline-none"/>
                                                    <button onClick={async () => {
                                                        if(!replyBody.trim()) return;
                                                        try { await api.post(`/shops/${shop._id}/reviews/${r._id}/reply`, { body: replyBody }); setReplyBody(''); setReplyingTo(null); fetchReviews(); }
                                                        catch (err) { setError(errMsg(err)); }
                                                    }} className="btn-primary px-2 py-1 rounded text-[10px]">Send</button>
                                                </div>
                                            )}
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>

                        <div className="text-right mt-6">
                            <button onClick={onClose} className="bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400 transition">Close</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== Modal (post or shop) ====================
        function Modal({ entry, onClose, areas, postCategories, shopCategories, setError, setSuccess, setLoading, onSaved }) {
            const { type, item } = entry; // 'post' | 'shop'
            const isEdit = !!item;
            const [form, setForm] = useState(() => ({
                category:    item?.category    || (type === 'post' ? 'rooms' : 'other'),
                title:       item?.title       || '',
                name:        item?.name        || '',
                description: item?.description || '',
                price:       item?.price       ?? '',
                mobile:      item?.mobile      || '',
                contact:     item?.contact     || '',
                location:    item?.location    || '',
                address:     item?.address     || '',
                openAt:      item?.openAt      || '',
                closeAt:     item?.closeAt     || '',
                lat:         item?.lat         ?? null,
                lng:         item?.lng         ?? null,
                image:       item?.image       || '',
            }));
            const change = (e) => setForm(f => ({...f, [e.target.name]: e.target.value}));
            const setLatLng = (lat, lng) => setForm(f => ({...f, lat, lng}));
            const [uploading, setUploading] = useState(false);

            const onFile = async (e) => {
                const f = e.target.files?.[0];
                if (!f) return;
                setUploading(true);
                try {
                    const url = await uploadImageFile(f);
                    setForm(prev => ({...prev, image: url}));
                } catch (err) { setError('Upload failed: ' + errMsg(err)); }
                finally { setUploading(false); }
            };

            const buildPayload = () => {
                if (type === 'post') return {
                    category: form.category, title: form.title, description: form.description,
                    price: Number(form.price), mobile: form.mobile, contact: form.contact || undefined,
                    location: form.location, image: form.image || undefined,
                };
                return {
                    name: form.name, description: form.description, category: form.category,
                    location: form.location, address: form.address || undefined,
                    openAt: form.openAt || undefined, closeAt: form.closeAt || undefined,
                    lat: form.lat ?? undefined, lng: form.lng ?? undefined,
                    mobile: form.mobile, image: form.image || undefined,
                };
            };

            const submit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const payload = buildPayload();
                    const base = type === 'post' ? '/posts' : '/shops';
                    if (isEdit) await api.put(`${base}/${item._id}`, payload);
                    else        await api.post(base, payload);
                    setSuccess(type === 'shop' && !isEdit ? 'Shop submitted for review' : (isEdit ? 'Updated' : 'Posted'));
                    onSaved?.(); onClose();
                } catch (err) { setError('Save failed: ' + errMsg(err)); }
                finally { setLoading(false); }
            };

            const heading = (isEdit ? 'Edit ' : 'Post ') + (type === 'post' ? 'something' : 'a shop');
            const isRoom = type === 'post' && form.category === 'rooms';

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 p-4" onClick={onClose}>
                    <div className={`bg-white p-6 sm:p-8 rounded-xl shadow-2xl ${type === 'shop' ? 'max-w-xl' : 'max-w-md'} w-full max-h-[90vh] overflow-y-auto`} onClick={e=>e.stopPropagation()}>
                        <h2 className="text-2xl font-bold mb-5">{heading}</h2>
                        <form onSubmit={submit} className="space-y-3">
                            <div>
                                <label className="text-xs text-gray-600 uppercase tracking-wider">Category</label>
                                <select name="category" value={form.category} onChange={change} required
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 capitalize">
                                    {(type === 'post' ? postCategories : shopCategories).map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            {type === 'post' ? (
                                <input name="title" placeholder="Title" value={form.title} onChange={change} required minLength={1} maxLength={120}
                                       className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            ) : (
                                <input name="name" placeholder="Shop name" value={form.name} onChange={change} required minLength={1} maxLength={120}
                                       className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            )}
                            <textarea name="description" placeholder="Description" value={form.description} onChange={change} required minLength={1} maxLength={2000} rows={3}
                                      className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            {type === 'post' && (
                                <input name="price" type="number" min="0" placeholder={isRoom ? 'Monthly rent (₹)' : 'Price (₹)'} value={form.price} onChange={change} required
                                       className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            )}
                            <select name="location" value={form.location} onChange={change} required
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">Select Chennai area</option>
                                {areas.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                            {type === 'shop' && (
                                <>
                                    <input name="address" placeholder="Street address (e.g. 12 Bazaar St, opposite the temple)" value={form.address} onChange={change} maxLength={300}
                                           className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-gray-600 uppercase tracking-wider mb-1 block">Default Open Time</label>
                                            <input name="openAt" type="time" value={form.openAt} onChange={change} className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-600 uppercase tracking-wider mb-1 block">Default Close Time</label>
                                            <input name="closeAt" type="time" value={form.closeAt} onChange={change} className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                        </div>
                                    </div>
                                </>
                            )}
                            {type === 'shop' && (
                                <div>
                                    <label className="text-xs text-gray-600 uppercase tracking-wider">Pin exact location</label>
                                    <MapPicker lat={form.lat} lng={form.lng} onChange={setLatLng}/>
                                </div>
                            )}
                            <input name="mobile" type="tel" placeholder="Mobile number (required, private)" value={form.mobile} onChange={change} required pattern="[0-9+\-\s]{10,20}"
                                   className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            <p className="text-xs text-gray-500 -mt-1">📞 Only DIVI staff can see this; other users can't.</p>
                            {type === 'post' && (
                                <input name="contact" placeholder="Best time to contact (optional)" value={form.contact} onChange={change} maxLength={80}
                                       className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            )}
                            <div>
                                <label className="text-xs text-gray-600 uppercase tracking-wider">Image</label>
                                <input type="file" accept="image/*" onChange={onFile} className="block w-full text-sm mt-1"/>
                                {uploading && <span className="text-xs text-gray-500">Uploading...</span>}
                                {form.image && <img src={imageUrl(form.image)} alt="" className="mt-2 w-32 h-24 object-cover rounded"/>}
                                <input name="image" type="text" placeholder="...or paste image URL" value={form.image} onChange={change} maxLength={500}
                                       className="w-full px-3 py-2 border border-gray-300 rounded-md text-xs mt-1"/>
                            </div>
                            {type === 'shop' && !isEdit && (
                                <p className="text-xs bg-yellow-50 text-yellow-800 px-3 py-2 rounded border border-yellow-200">
                                    📋 Your shop will be reviewed by DIVI staff before going live (usually within a day). Once approved you'll get a Shopper ID like <code>DIVI-SHOP-0001</code>.
                                </p>
                            )}
                            <div className="flex justify-end gap-3 pt-2">
                                <button type="button" onClick={onClose} className="bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400 transition">Cancel</button>
                                <button type="submit" className="btn-primary px-4 py-2 rounded-md transition">{isEdit ? 'Save changes' : 'Submit'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ==================== Profile (regular user) ====================
        function Profile({ user, setUser, setError, setSuccess, setLoading, setShowModal, refreshKey, onChanged }) {
            const [listings, setListings] = useState({ posts: [], shops: [] });
            const [interests, setInterests] = useState([]);
            const [busy, setBusy] = useState(false);
            const [name, setName] = useState(user.name || '');
            const [mobile, setMobile] = useState(user.mobile || '');

            const fetchAll = useCallback(() => {
                setBusy(true);
                Promise.all([api.get('/user/listings'), api.get('/my-interests')])
                    .then(([l, i]) => { setListings(l.data); setInterests(i.data); })
                    .catch(err => setError(errMsg(err)))
                    .finally(() => setBusy(false));
            }, [setError]);
            useEffect(() => { fetchAll(); }, [fetchAll, refreshKey]);

            const saveProfile = async () => {
                setLoading(true);
                try {
                    const r = await api.put('/me', { name, mobile });
                    setUser(u => ({ ...u, name: r.data.user.name, mobile: r.data.user.mobile }));
                    setSuccess('Profile updated');
                } catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const [currentPassword, setCurrentPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const changePassword = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await api.patch('/me/password', { currentPassword, newPassword });
                    setSuccess('Password updated securely');
                    setCurrentPassword(''); setNewPassword('');
                } catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const removePost = async (id) => {
                if (!window.confirm('Delete this post?')) return;
                setLoading(true);
                try { await api.delete(`/posts/${id}`); setSuccess('Deleted'); fetchAll(); onChanged?.(); }
                catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const removeShop = async (id) => {
                if (!window.confirm('Delete this shop and all its reviews?')) return;
                setLoading(true);
                try { await api.delete(`/shops/${id}`); setSuccess('Deleted'); fetchAll(); onChanged?.(); }
                catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const toggleOnline = async (shop) => {
                const newVal = shop.isOnline === false ? true : false;
                setLoading(true);
                try {
                    await api.patch(`/shops/${shop._id}/online`, { isOnline: newVal });
                    setSuccess(`Shop is now ${newVal ? 'Open' : 'Closed'}`);
                    fetchAll(); onChanged?.();
                } catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const editPost = (post) => setShowModal({ type: 'post', item: post });
            const editShop = (shop) => setShowModal({ type: 'shop', item: shop });

            const dropInterest = async (interest) => {
                setLoading(true);
                try { await api.delete(`/posts/${interest.postId}/interest`); setSuccess('Removed'); fetchAll(); }
                catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const statusBadge = (s) => {
                if (s === 'approved') return <span className="badge bg-green-100 text-green-700">Approved</span>;
                if (s === 'rejected') return <span className="badge bg-red-100 text-red-700">Rejected</span>;
                return <span className="badge bg-yellow-100 text-yellow-700">Pending review</span>;
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold mb-4">Profile</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input value={name} onChange={e=>setName(e.target.value)} className="px-3 py-2 border border-gray-300 rounded-md" placeholder="Name"/>
                            <input value={mobile} onChange={e=>setMobile(e.target.value)} pattern="[0-9+\-\s]{10,20}" className="px-3 py-2 border border-gray-300 rounded-md" placeholder="Mobile"/>
                        </div>
                        <p className="text-xs text-gray-500 mt-1">Email: {user.email}</p>
                        <button onClick={saveProfile} className="btn-primary mt-3 px-4 py-2 rounded-md">Save profile</button>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold mb-4">Security</h2>
                        <form onSubmit={changePassword} className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-end">
                            <div>
                                <label className="text-xs text-gray-500 block mb-1">Current Password (if set)</label>
                                <input type="password" value={currentPassword} onChange={e=>setCurrentPassword(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Leave blank if Google Login"/>
                            </div>
                            <div>
                                <label className="text-xs text-gray-500 block mb-1">New Password (min 6 chars)</label>
                                <input type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} required minLength={6} className="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="New Password"/>
                            </div>
                            <div className="sm:col-span-2">
                                <button type="submit" className="btn-primary px-4 py-2 rounded-md">Change Password</button>
                            </div>
                        </form>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold mb-4">My posts</h2>
                        {busy ? <div className="flex justify-center py-4"><div className="spinner"></div></div> : listings.posts.length === 0 ? <p className="text-sm text-gray-500">No posts yet.</p> : (
                            <ul className="divide-y border border-gray-200 rounded-lg">
                                {listings.posts.map(p => (
                                    <li key={p._id} className="flex justify-between items-center px-4 py-3 gap-3">
                                        <div className="min-w-0">
                                            <p className="font-medium truncate">{p.title}</p>
                                            <p className="text-gray-500 text-sm truncate">
                                                <span className="capitalize">{p.category}</span> · ₹{p.price}{p.isRent ? '/mo' : ''} · {p.location}
                                            </p>
                                        </div>
                                        <div className="flex gap-2 flex-shrink-0">
                                            <button onClick={() => editPost(p)} className="text-indigo-600 hover:underline text-sm">Edit</button>
                                            <button onClick={() => removePost(p._id)} className="text-red-600 hover:underline text-sm">Delete</button>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold mb-4">My shops</h2>
                        {busy ? null : listings.shops.length === 0 ? <p className="text-sm text-gray-500">No shops listed.</p> : (
                            <ul className="divide-y border border-gray-200 rounded-lg">
                                {listings.shops.map(s => (
                                    <li key={s._id} className="flex justify-between items-center px-4 py-3 gap-3">
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <p className="font-medium truncate">{s.name}</p>
                                                {statusBadge(s.status)}
                                            </div>
                                            <p className="text-gray-500 text-sm truncate">{s.category} · {s.location}</p>
                                            {s.status === 'rejected' && s.rejectReason && (
                                                <p className="text-red-600 text-xs mt-1">Reason: {s.rejectReason}</p>
                                            )}
                                        </div>
                                        <div className="flex gap-2 flex-shrink-0 flex-col items-end">
                                            {s.status === 'approved' && (
                                                <button onClick={() => toggleOnline(s)} className={`${s.isOnline === false ? 'btn-primary' : 'bg-orange-100 text-orange-800'} px-3 py-1 rounded text-xs font-semibold`}>
                                                    {s.isOnline === false ? 'Go Online' : 'Go Offline'}
                                                </button>
                                            )}
                                            <div className="flex gap-2 mt-1">
                                                <button onClick={() => editShop(s)} className="text-indigo-600 hover:underline text-sm">Edit</button>
                                                <button onClick={() => removeShop(s._id)} className="text-red-600 hover:underline text-sm">Delete</button>
                                            </div>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow">
                        <h2 className="text-xl font-bold mb-4">My interests</h2>
                        {interests.length === 0 ? <p className="text-sm text-gray-500">You haven't expressed interest in anything yet.</p> : (
                            <ul className="divide-y border border-gray-200 rounded-lg">
                                {interests.map(i => (
                                    <li key={i._id} className="flex justify-between items-center px-4 py-3">
                                        <div className="text-sm">
                                            <p className="font-medium">{new Date(i.createdAt).toLocaleString()}</p>
                                            {i.note && <p className="text-gray-600">"{i.note}"</p>}
                                        </div>
                                        <button onClick={() => dropInterest(i)} className="text-red-600 hover:underline text-sm">Remove</button>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>
                </div>
            );
        }

        // ==================== Staff Panel ====================
        function StaffPanel({ user, areas, setError, setSuccess, setLoading, openChatWith }) {
            const [section, setSection] = useState('posts'); // posts | shops | contacts
            return (
                <div className="space-y-4">
                    <div className="bg-white p-4 rounded-xl shadow flex flex-wrap gap-3 items-center">
                        <h2 className="text-xl font-bold mr-4">Staff dashboard <span className="text-sm font-normal text-gray-500">— {user.email}</span></h2>
                        <button onClick={() => setSection('posts')}    className={`px-4 py-2 rounded-md text-sm ${section==='posts'?'btn-primary':'bg-gray-200 text-gray-700'}`}>Posts &amp; interests</button>
                        <button onClick={() => setSection('shops')}    className={`px-4 py-2 rounded-md text-sm ${section==='shops'?'btn-primary':'bg-gray-200 text-gray-700'}`}>Shops</button>
                        <button onClick={() => setSection('contacts')} className={`px-4 py-2 rounded-md text-sm ${section==='contacts'?'btn-primary':'bg-gray-200 text-gray-700'}`}>All contacts</button>
                    </div>
                    {section === 'posts'    && <StaffPosts setError={setError} openChatWith={openChatWith}/>}
                    {section === 'shops'    && <StaffShops setError={setError} setSuccess={setSuccess} setLoading={setLoading} user={user} openChatWith={openChatWith}/>}
                    {section === 'contacts' && <StaffContacts setError={setError} openChatWith={openChatWith}/>}
                </div>
            );
        }

        function StaffPosts({ setError, openChatWith }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [openId, setOpenId] = useState(null);
            const [interests, setInterests] = useState({});
            useEffect(() => {
                setLoading(true);
                api.get('/posts', { params: { limit: 50 } })
                    .then(r => setData(r.data?.data || []))
                    .catch(err => setError(errMsg(err)))
                    .finally(() => setLoading(false));
            }, []);
            const toggle = async (id) => {
                if (openId === id) { setOpenId(null); return; }
                setOpenId(id);
                if (!interests[id]) {
                    try {
                        const r = await api.get(`/posts/${id}/interests`);
                        setInterests(prev => ({...prev, [id]: r.data}));
                    } catch (err) { setError(errMsg(err)); }
                }
            };
            return (
                <div className="bg-white p-6 rounded-xl shadow">
                    <h3 className="font-semibold mb-3">Recent posts</h3>
                    {loading ? <div className="flex justify-center py-6"><div className="spinner"></div></div> : (
                        <ul className="divide-y border border-gray-200 rounded-lg">
                            {data.map(d => (
                                <li key={d._id} className="px-4 py-3">
                                    <div className="flex justify-between items-start gap-3">
                                        <div className="min-w-0">
                                            <p className="font-medium">{d.title} <span className="badge bg-indigo-100 text-indigo-700 capitalize ml-1">{d.category}</span></p>
                                            <p className="text-sm text-gray-600">₹{d.price}{d.isRent ? '/mo' : ''} · {d.location} · by {d.userId}</p>
                                            <p className="text-sm text-gray-700">📞 <span className="font-medium">{d.mobile || '—'}</span></p>
                                        </div>
                                        <div className="flex flex-col items-end gap-1 flex-shrink-0">
                                            <button onClick={() => toggle(d._id)} className="text-indigo-600 hover:underline text-sm">{openId === d._id ? 'Hide' : 'Show'} interests</button>
                                            <button onClick={() => openChatWith(d.userId, { postId: d._id })} className="text-indigo-600 hover:underline text-sm">Chat poster</button>
                                            {d.mobile && <a href={`https://wa.me/${(d.mobile||'').replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" className="text-green-700 hover:underline text-sm">WhatsApp</a>}
                                        </div>
                                    </div>
                                    {openId === d._id && (
                                        <div className="mt-3 ml-2 border-l-2 border-indigo-200 pl-4">
                                            <h4 className="text-sm font-semibold text-gray-700 mb-2">Interested users</h4>
                                            {(interests[d._id] || []).length === 0 ? <p className="text-sm text-gray-500">No interest yet.</p> : (interests[d._id] || []).map(i => (
                                                <div key={i._id} className="text-sm py-1.5 flex justify-between items-center">
                                                    <div>
                                                        <span className="font-medium">{i.userName}</span> <span className="text-gray-500">{i.userEmail}</span> · 📞 {i.userMobile}
                                                        {i.note && <p className="text-gray-600 text-xs mt-0.5">"{i.note}"</p>}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => openChatWith(i.userEmail, { postId: d._id })} className="text-indigo-600 hover:underline">Chat</button>
                                                        <a href={`https://wa.me/${(i.userMobile||'').replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" className="text-green-700 hover:underline">WhatsApp</a>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        function StaffShops({ setError, setSuccess, setLoading, user, openChatWith }) {
            const [shops, setShops] = useState([]);
            const [busy, setBusy] = useState(false);
            const fetchAll = useCallback(() => {
                setBusy(true);
                api.get('/shops', { params: { limit: 50 } })
                    .then(r => setShops(r.data?.data || []))
                    .catch(err => setError(errMsg(err)))
                    .finally(() => setBusy(false));
            }, [setError]);
            useEffect(() => { fetchAll(); }, [fetchAll]);
            return (
                <div className="bg-white p-6 rounded-xl shadow">
                    <h3 className="font-semibold mb-3">Approved shops ({shops.length})</h3>
                    {busy ? <div className="flex justify-center py-6"><div className="spinner"></div></div> : (
                        <ul className="divide-y border border-gray-200 rounded-lg">
                            {shops.map(s => (
                                <li key={s._id} className="flex justify-between items-center px-4 py-3 gap-3">
                                    <div className="min-w-0">
                                        <p className="font-medium">{s.name} <span className="text-xs text-gray-500 capitalize">· {s.category}</span></p>
                                        <p className="text-sm text-gray-600">{s.location} · by {s.userId}</p>
                                        <p className="text-sm flex items-center gap-1"><Stars value={s.rating}/> <span className="text-xs text-gray-500">({s.reviewCount})</span></p>
                                        <p className="text-sm text-gray-700">📞 {s.mobile}</p>
                                    </div>
                                    <div className="flex gap-2 flex-shrink-0">
                                        <button onClick={() => openChatWith(s.userId)} className="text-indigo-600 hover:underline text-sm">Chat</button>
                                        {s.mobile && <a href={`https://wa.me/${(s.mobile||'').replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" className="text-green-700 hover:underline text-sm">WhatsApp</a>}
                                    </div>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        function StaffContacts({ setError, openChatWith }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [search, setSearch] = useState('');
            useEffect(() => {
                setLoading(true);
                api.get('/staff/contacts').then(r => setData(r.data)).catch(err => setError(errMsg(err))).finally(() => setLoading(false));
            }, []);
            const filtered = data.filter(u => !search || u.name.toLowerCase().includes(search.toLowerCase()) || (u.email||'').includes(search) || (u.mobile||'').includes(search));
            return (
                <div className="bg-white p-6 rounded-xl shadow">
                    <div className="flex justify-between items-center mb-4 gap-3 flex-wrap">
                        <h3 className="font-semibold">User contacts ({filtered.length})</h3>
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." className="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                    </div>
                    {loading ? <div className="flex justify-center py-6"><div className="spinner"></div></div> : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-100"><tr><th className="p-2 text-left">Name</th><th className="p-2 text-left">Email</th><th className="p-2 text-left">Mobile</th><th className="p-2 text-left">Joined</th><th className="p-2"></th></tr></thead>
                                <tbody>
                                    {filtered.map(u => (
                                        <tr key={u._id} className="border-b">
                                            <td className="p-2">{u.name}</td>
                                            <td className="p-2 text-xs">{u.email}</td>
                                            <td className="p-2">{u.mobile || '—'}</td>
                                            <td className="p-2 text-xs">{new Date(u.createdAt).toLocaleDateString()}</td>
                                            <td className="p-2 text-right whitespace-nowrap">
                                                <button onClick={() => openChatWith(u.email, { name: u.name })} className="text-indigo-600 hover:underline mr-3 text-xs">Chat</button>
                                                {u.mobile && <a href={`https://wa.me/${(u.mobile||'').replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" className="text-green-700 hover:underline text-xs">WhatsApp</a>}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        function AdminPanel(props) {
            const { user, setError, setSuccess, setLoading } = props;
            const [tab, setTab] = useState('overview');
            const btn = (t, label) => <button onClick={() => setTab(t)} className={`px-4 py-2 rounded-md text-sm ${tab===t?'btn-primary':'bg-gray-200 text-gray-700'}`}>{label}</button>;
            return (
                <div className="space-y-4">
                    <div className="bg-white p-4 rounded-xl shadow flex flex-wrap gap-2 items-center">

                        {btn('overview',  'Overview')}
                        {btn('allshops',  'All Shops')}
                        {btn('pending',   'Pending')}
                        {btn('hof',       'Hall of Fame')}
                        {btn('bookings',  'Bookings')}
                        {btn('users',     'Users')}
                        {btn('employees', 'Employees')}
                        {btn('settings',  'Settings')}

                    {tab === 'overview'  && <OwnerOverview setError={setError}/>}

                    {tab === 'pending'   && <OwnerPending setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>}

                    {tab === 'users'     && <OwnerUsers setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>}
                    {tab === 'employees' && <OwnerEmployees user={user} setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>}
                    {tab === 'settings'  && <OwnerSettings user={user} siteConfig={props.siteConfig} setSiteConfig={props.setSiteConfig} setError={setError} setSuccess={setSuccess} setLoading={setLoading}/>}
                </div>
            );
        }

        // ==================== OwnerAllShops ====================
        function OwnerAllShops({ setError, setSuccess, setLoading }) {
            const [list, setList] = useState([]);
            const [search, setSearch] = useState('');
            const [busy, setBusy] = useState(false);
            const fetchAll = useCallback(() => {
                setBusy(true);
                api.get('/admin/shops/all', { params: { search: search || undefined } })
                    .then(r => setList(r.data)).catch(err => setError(errMsg(err))).finally(() => setBusy(false));
            }, [search, setError]);
            useEffect(() => { const t = setTimeout(fetchAll, 300); return () => clearTimeout(t); }, [fetchAll]);
            const del = async (id, name) => {
                if (!window.confirm(`Delete "${name}" and all its reviews, Hall of Fame entries & bookings?`)) return;
                setLoading(true);
                try { await api.delete(`/shops/${id}`); setSuccess('Shop deleted'); fetchAll(); }
                catch (err) { setError(errMsg(err)); } finally { setLoading(false); }
            };
            const statusBadge = (s) => {
                const map = { approved: 'bg-green-100 text-green-700', pending: 'bg-yellow-100 text-yellow-800', rejected: 'bg-red-100 text-red-700' };
                return <span className={`badge ${map[s] || ''}`}>{s}</span>;
            };
            return (
                <div className="bg-white p-6 rounded-xl shadow">
                    <div className="flex justify-between items-center mb-4 gap-3 flex-wrap">
                        <h3 className="font-semibold">All Shops ({list.length})</h3>
                        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search shops..." className="px-3 py-2 border border-gray-300 rounded-md text-sm w-64"/>
                    </div>
                    {busy ? <div className="flex justify-center py-6"><div className="spinner"></div></div> : list.length === 0 ? <p className="text-sm text-gray-500">No shops found.</p> : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-100"><tr><th className="p-2 text-left">Name</th><th className="p-2 text-left">Category</th><th className="p-2 text-left">Area</th><th className="p-2 text-left">Status</th><th className="p-2 text-left">Owner</th><th className="p-2"></th></tr></thead>
                                <tbody>
                                    {list.map(s => (
                                        <tr key={s._id} className="border-b">
                                            <td className="p-2 font-medium">{s.name}{s.shopperId && <span className="ml-2 text-xs text-indigo-500 font-mono">{s.shopperId}</span>}</td>
                                            <td className="p-2 capitalize text-xs">{s.category}</td>
                                            <td className="p-2 text-xs">{s.location}</td>
                                            <td className="p-2">{statusBadge(s.status)}</td>
                                            <td className="p-2 text-xs text-gray-500">{s.userId}</td>
                                            <td className="p-2 text-right">
                                                <button onClick={() => del(s._id, s.name)} className="text-red-600 hover:underline text-xs">Delete</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }


        function OwnerHoF({ setError, setSuccess, setLoading }) {
            const [list, setList] = useState([]);
            const [busy, setBusy] = useState(false);

        function ChatDrawer({ user, peer, setPeer, staffList, onClose, setError }) {
            const [threads, setThreads] = useState([]);
            const [messages, setMessages] = useState([]);
            const [body, setBody] = useState('');
            const scrollRef = useRef(null);
            const inputRef = useRef(null);
            const isStaff = user.isStaff;

            useEffect(() => {
                let cancelled = false;
                const tick = async () => { try { const r = await api.get('/messages/threads'); if (!cancelled) setThreads(r.data); } catch {} };
                tick(); const id = setInterval(tick, 6000);
                return () => { cancelled = true; clearInterval(id); };
            }, []);

            useEffect(() => {
                if (!peer?.email) return;
                let cancelled = false;
                const tick = async () => {
                    try { const r = await api.get(`/messages/with/${encodeURIComponent(peer.email)}`); if (!cancelled) setMessages(r.data); }
                    catch (err) { setError('Chat: ' + errMsg(err)); }
                };
                tick(); const id = setInterval(tick, 4000);
                return () => { cancelled = true; clearInterval(id); };
            }, [peer?.email]);

            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

            const send = async (e) => {
                e?.preventDefault();
                if (!body.trim() || !peer?.email) return;
                try {
                    await api.post('/messages', { to: peer.email, body });
                    setBody('');
                    const r = await api.get(`/messages/with/${encodeURIComponent(peer.email)}`);
                    setMessages(r.data);
                    inputRef.current?.focus();
                } catch (err) { setError('Send failed: ' + errMsg(err)); }
            };

            return (
                <div className="chat-drawer">
                    <div className="px-4 py-3 bg-indigo-600 text-white flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            {peer?.email ? (
                                <>
                                    <button onClick={() => setPeer(null)} className="opacity-90 hover:opacity-100">←</button>
                                    <div><div className="font-semibold text-sm">{peer.name || peer.email}</div></div>
                                </>
                            ) : <div className="font-semibold">DIVI Chat</div>}
                        </div>
                        <button onClick={onClose} className="text-2xl leading-none opacity-90 hover:opacity-100">×</button>
                    </div>
                    {!peer?.email ? (
                        <div className="flex-1 overflow-y-auto">
                            {!isStaff && (
                                <div className="p-4 border-b">
                                    <p className="text-xs text-gray-500 mb-2">Chat with DIVI staff:</p>
                                    {staffList.map(s => (
                                        <button key={s.email} onClick={() => setPeer({ email: s.email, name: s.name })} className="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded text-sm">
                                            <span className="font-medium">{s.name}</span> <span className="text-gray-400">· {s.email}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                            <div className="p-2">
                                <p className="text-xs text-gray-500 px-2 py-1">Conversations</p>
                                {threads.length === 0 ? <p className="px-3 py-4 text-sm text-gray-400">None yet.</p> : threads.map(t => (
                                    <button key={t.peer} onClick={() => setPeer({ email: t.peer })} className="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded">
                                        <div className="flex justify-between items-center"><span className="font-medium text-sm">{t.peer}</span></div>
                                        <span className="text-xs text-gray-500 truncate block">{t.lastMessage}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <>
                            <div ref={scrollRef} className="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50">
                                {messages.map(m => {
                                    const me = m.from === user.email;
                                    return (
                                        <div key={m._id} className={`flex ${me ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] px-3 py-2 text-sm ${me ? 'chat-bubble-me' : 'chat-bubble-them'}`}>
                                                <div className="whitespace-pre-line">{m.body}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <form onSubmit={send} className="p-3 border-t flex gap-2">
                                <input ref={inputRef} value={body} onChange={e=>setBody(e.target.value)} placeholder="Type..." className="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm"/>
                                <button type="submit" className="btn-primary px-4 rounded-md">Send</button>
                            </form>
                        </>
                    )}
                </div>
            );
        }

        function HallOfFamePage({ user, setError }) {
