                    {loading ? <div className="flex justify-center py-12"><div className="spinner"/></div> : entries.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-2xl shadow-sm">
                            <div className="text-6xl mb-3">🏆</div>
                            <p className="font-semibold text-lg" style={{color:'var(--t1)'}}>No entries yet</p>
                            <p className="text-sm mt-1" style={{color:'var(--t3)'}}>Book a work-day at a shop to be featured here!</p>
                        </div>
                    ) : (
                        <>
                            {Object.entries(grouped).map(([month, list], gi) => (
                                <div key={month} className="mb-10">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full" style={{background:'var(--bg)',color:'var(--p)'}}>📅 {month}</span>
                                        <div style={{flex:1,height:1,background:'var(--bdr)'}}/>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                        {list.map((h, i) => (
                                            <div key={h._id} className={`fade-in rounded-2xl overflow-hidden shadow-sm border ${gi===0 && i===0 ? 'border-yellow-300 ring-2 ring-yellow-200' : 'border-gray-100'}`} style={{background: gi===0 && i===0 ? 'linear-gradient(135deg,#fffbeb,#fff7ed)' : '#fff'}}>
                                                {gi===0 && i===0 && <div className="bg-yellow-400 text-yellow-900 text-xs font-bold text-center py-1 tracking-wider">⭐ MOST RECENT</div>}
                                                {h.image && <img src={imageUrl(h.image)} alt={h.personName} className="w-full h-44 object-cover" onError={e=>e.target.style.display='none'}/>}
                                                <div className="p-4">
                                                    <div className="flex items-start justify-between gap-2 mb-1">
                                                        <p className="font-bold text-base" style={{color:'var(--t1)'}}>{h.personName}</p>
                                                        {h.profession && <span className="badge bg-indigo-100 text-indigo-700 flex-shrink-0">{h.profession}</span>}
                                                    </div>
                                                    <p className="text-xs mb-2" style={{color:'var(--p)'}}>at {h.shopName}</p>
                                                    <p className="text-sm line-clamp-2" style={{color:'var(--t2)'}}>{h.description}</p>
                                                    {(h.workedFrom || h.workedTo) && <p className="text-xs mt-2" style={{color:'var(--t3)'}}>{h.workedFrom ? new Date(h.workedFrom).toLocaleDateString('en-IN') : ''}{h.workedTo ? ' → ' + new Date(h.workedTo).toLocaleDateString('en-IN') : ''}</p>}
                                                    {(h.soldAmount || h.earnedAmount) && (
                                                        <div className="flex gap-2 mt-2 flex-wrap">
                                                            {h.soldAmount && <span className="badge" style={{background:'#fee2e2',color:'#b91c1c'}}>Sold ₹{h.soldAmount}</span>}
                                                            {h.earnedAmount && <span className="badge" style={{background:'#d1fae5',color:'#065f46'}}>Earned ₹{h.earnedAmount}</span>}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                            {total > LIMIT && (
                                <div className="flex justify-center gap-3 mt-6">
                                    <button onClick={() => setPage(p=>Math.max(1,p-1))} disabled={page<=1} className="pagination-btn">← Prev</button>
                                    <span className="text-sm self-center" style={{color:'var(--t2)'}}>Page {page}</span>
                                    <button onClick={() => setPage(p=>p+1)} disabled={page*LIMIT>=total} className="pagination-btn">Next →</button>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        // ==================== Events Page ====================
        function EventsPage({ user, areas, setError, setSuccess, setLoading }) {
            const [events, setEvents] = useState([]);
            const [busy, setBusy] = useState(false);
            const [area, setArea] = useState('');
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ title:'', description:'', area:'', date:'', endDate:'', venue:'', image:'' });

            const fetchEvents = useCallback(() => {
                setBusy(true);
                api.get('/events', { params: area ? { area } : {} })
                    .then(r => setEvents(r.data || []))
                    .catch(() => {})
                    .finally(() => setBusy(false));
            }, [area]);

            useEffect(() => { fetchEvents(); }, [fetchEvents]);

            const submit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await api.post('/events', form);
                    setSuccess('Event posted!');
                    setShowForm(false);
                    setForm({ title:'', description:'', area:'', date:'', endDate:'', venue:'', image:'' });
                    fetchEvents();
                } catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            const del = async (id) => {
                if (!window.confirm('Delete event?')) return;
                setLoading(true);
                try { await api.delete(`/events/${id}`); setSuccess('Deleted'); fetchEvents(); }
                catch (err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            return (
                <div className="fade-in">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                        <div>
                            <h2 className="text-2xl font-extrabold" style={{color:'var(--t1)'}}>🎉 Events in Chennai</h2>
                            <p className="text-sm mt-1" style={{color:'var(--t2)'}}>Upcoming events across the city — food fests, markets &amp; more.</p>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            <select value={area} onChange={e=>setArea(e.target.value)} className="px-3 py-2 border-2 border-gray-200 rounded-xl text-sm focus:outline-none bg-white">
                                <option value="">All areas</option>
                                {areas.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                            {user?.isAdmin && <button onClick={() => setShowForm(s=>!s)} className="btn-primary px-4 py-2 rounded-xl text-sm">{showForm ? '✕ Cancel' : '+ Add Event'}</button>}
                        </div>
                    </div>

                    {showForm && user?.isAdmin && (
                        <form onSubmit={submit} className="bg-white border border-indigo-100 rounded-2xl p-5 mb-6 shadow-sm fade-in space-y-3">
                            <h3 className="font-bold text-lg mb-1">New Event</h3>
                            <input required placeholder="Event title *" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} className="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                            <textarea required placeholder="Description *" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} rows={3} className="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                            <div className="grid grid-cols-2 gap-3">
                                <select required value={form.area} onChange={e=>setForm(f=>({...f,area:e.target.value}))} className="px-3 py-2 border border-gray-200 rounded-xl text-sm">
                                    <option value="">Select area *</option>
                                    {areas.map(a => <option key={a} value={a}>{a}</option>)}
                                </select>
                                <input placeholder="Venue" value={form.venue} onChange={e=>setForm(f=>({...f,venue:e.target.value}))} className="px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                                <input required type="datetime-local" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} className="px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                                <input type="datetime-local" value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))} className="px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                            </div>
                            <input placeholder="Image URL (optional)" value={form.image} onChange={e=>setForm(f=>({...f,image:e.target.value}))} className="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm"/>
                            <button type="submit" className="btn-primary px-5 py-2 rounded-xl font-semibold">Post Event</button>
                        </form>
                    )}

                    {busy ? <div className="flex justify-center py-12"><div className="spinner"/></div> : events.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-2xl shadow-sm">
                            <div className="text-6xl mb-3">🎉</div>
                            <p className="font-semibold text-lg" style={{color:'var(--t1)'}}>No upcoming events</p>
                            <p className="text-sm mt-1" style={{color:'var(--t3)'}}>Check back soon — events will be posted by the DIVI team.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                            {events.map(ev => {
                                const d = new Date(ev.date);
                                const isToday = d.toDateString() === new Date().toDateString();
                                return (
                                    <div key={ev._id} className={`card fade-in ${isToday ? 'ring-2 ring-orange-300' : ''}`}>
                                        {ev.image && <img src={imageUrl(ev.image)} alt={ev.title} className="w-full h-40 object-cover" onError={e=>e.target.style.display='none'}/>}
                                        {isToday && <div className="bg-orange-500 text-white text-xs font-bold text-center py-1">🔴 HAPPENING TODAY</div>}
                                        <div className="p-4">
                                            <h3 className="font-bold text-base mb-1" style={{color:'var(--t1)'}}>{ev.title}</h3>
                                            <p className="text-sm line-clamp-2 mb-3" style={{color:'var(--t2)'}}>{ev.description}</p>
                                            <div className="flex flex-col gap-1 text-xs" style={{color:'var(--t3)'}}>
                                                <span>📅 {d.toLocaleDateString('en-IN', {weekday:'short',day:'numeric',month:'short'})} · {d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
                                                {ev.venue && <span>📍 {ev.venue}</span>}
                                                <span>🏙 {ev.area}</span>
                                            </div>
                                            {user?.isAdmin && <button onClick={() => del(ev._id)} className="mt-3 text-xs text-red-500 hover:underline">Delete</button>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // ==================== Community Panel ====================
        const STICKERS = ['😀','😂','❤️','🔥','👍','🙏','😍','😭','🤣','✅','🎉','💯','😎','🤔','👋','💪','🍡','🍎','🥘','🏆'];
        function CommunityPanel({ user, areas, onClose, setError }) {
            const [area, setArea] = useState('');
            const [posts, setPosts] = useState([]);
            const [body, setBody] = useState('');
            const [busy, setBusy] = useState(false);
            const [showStickers, setShowStickers] = useState(false);
            const [replyTo, setReplyTo] = useState(null);
            const [replyBody, setReplyBody] = useState('');
            const [replySticker, setReplySticker] = useState('');
            const bottomRef = useRef(null);

            const fetchPosts = useCallback(() => {
                api.get('/community', { params: area ? { area } : {} })
                    .then(r => setPosts(r.data || []))
                    .catch(() => {});
            }, [area]);

            useEffect(() => {
                fetchPosts();
                const id = setInterval(fetchPosts, 6000);
                return () => clearInterval(id);
            }, [fetchPosts]);

            useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [posts]);

            const send = async (sticker = '') => {
                if (!user) { setError('Please login to chat'); return; }
                if (!body.trim() && !sticker) return;
                setBusy(true);
                try {
                    await api.post('/community', { body: body.trim(), area, sticker });
                    setBody(''); setShowStickers(false); fetchPosts();
                } catch (err) { setError(errMsg(err)); }
                finally { setBusy(false); }
            };

            const sendReply = async (postId, sticker = '') => {
                if (!user) { setError('Please login to reply'); return; }
                if (!replyBody.trim() && !sticker) return;
                try {
                    await api.post(`/community/${postId}/reply`, { body: replyBody.trim(), sticker });
                    setReplyTo(null); setReplyBody(''); setReplySticker('');
                    fetchPosts();
                } catch (err) { setError(errMsg(err)); }
            };

            return (
                <div className="fixed inset-0 z-50 flex flex-col" style={{background:'rgba(15,23,42,.6)',backdropFilter:'blur(4px)'}}>
                    <div className="flex flex-col flex-1 max-w-2xl w-full mx-auto my-4 sm:my-8 bg-white rounded-2xl shadow-2xl overflow-hidden" style={{maxHeight:'92vh'}}>
                        {/* Header */}
                        <div className="flex items-center justify-between px-5 py-4" style={{background:'var(--p)',color:'#fff'}}>
                            <div>
                                <div className="font-bold text-lg">💬 Community Chat</div>
                                <div className="text-xs opacity-75">Chennai · Open to all · Ask anything</div>
                            </div>
                            <button onClick={onClose} className="text-2xl leading-none opacity-80 hover:opacity-100">×</button>
                        </div>

                        {/* Area selector */}
                        <div className="px-4 py-2 border-b flex items-center gap-3 bg-gray-50">
                            <span className="text-xs font-semibold" style={{color:'var(--t3)'}}>Area:</span>
                            <select value={area} onChange={e=>setArea(e.target.value)} className="text-sm border border-gray-200 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-400 bg-white">
                                <option value="">All Chennai</option>
                                {areas.map(a => <option key={a} value={a}>{a}</option>)}
                            </select>
                            <span className="text-xs" style={{color:'var(--t3)'}}>{posts.length} posts</span>
                        </div>

                        {/* Posts */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {posts.length === 0 && <p className="text-center py-8 text-sm" style={{color:'var(--t3)'}}>No posts yet. Be the first to share!</p>}
                            {posts.map(p => (
                                <div key={p._id} className="fade-in">
                                    <div className="flex gap-3">
                                        <div className="w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-sm text-white" style={{background:'var(--p)'}}>
                                            {(p.name||'?')[0].toUpperCase()}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="font-semibold text-sm" style={{color:'var(--t1)'}}>{p.name}</span>
                                                {p.area && <span className="badge bg-indigo-50 text-indigo-600">{p.area}</span>}
                                                <span className="text-xs" style={{color:'var(--t3)'}}>{new Date(p.createdAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
                                            </div>
                                            <div className="mt-1 p-3 rounded-xl rounded-tl-none text-sm" style={{background:'#f8fafc',color:'var(--t1)'}}>
                                                {p.sticker && <span className="text-3xl block mb-1">{p.sticker}</span>}
                                                {p.body && <span className="whitespace-pre-line">{p.body}</span>}
                                            </div>
                                            {/* Replies */}
                                            {(p.replies||[]).map((r, ri) => (
                                                <div key={ri} className="mt-2 ml-4 flex gap-2">
                                                    <div className="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold text-white" style={{background:'var(--a)'}}>
                                                        {(r.name||'?')[0].toUpperCase()}
                                                    </div>
                                                    <div className="flex-1">
                                                        <span className="text-xs font-semibold" style={{color:'var(--t2)'}}>{r.name} </span>
                                                        <span className="text-xs" style={{color:'var(--t3)'}}>{new Date(r.createdAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
                                                        <div className="mt-0.5 p-2 rounded-lg text-sm" style={{background:'#f1f5f9'}}>
                                                            {r.sticker && <span className="text-2xl block">{r.sticker}</span>}
                                                            {r.body}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            {/* Reply toggle */}
                                            {user && (
                                                <button onClick={() => setReplyTo(replyTo===p._id ? null : p._id)} className="text-xs mt-1 ml-1" style={{color:'var(--p)'}}>
                                                    ↩ Reply {p.replies?.length > 0 ? `(${p.replies.length})` : ''}
                                                </button>
                                            )}
                                            {replyTo === p._id && (
                                                <div className="mt-2 ml-4 flex gap-2 fade-in">
                                                    <input value={replyBody} onChange={e=>setReplyBody(e.target.value)} placeholder="Write a reply..." className="flex-1 px-3 py-1.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-400"
                                                        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(p._id); }}}/>
                                                    <button onClick={() => sendReply(p._id)} className="btn-primary px-3 py-1.5 rounded-xl text-xs">Send</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <div ref={bottomRef}/>
                        </div>

                        {/* Input */}
                        {user ? (
                            <div className="border-t p-3 space-y-2">
                                {showStickers && (
                                    <div className="flex flex-wrap gap-2 p-2 bg-gray-50 rounded-xl fade-in">
                                        {STICKERS.map(s => (
                                            <button key={s} onClick={() => send(s)} className="text-2xl hover:scale-125 transition-transform">{s}</button>
                                        ))}
                                    </div>
                                )}
                                <div className="flex gap-2">
                                    <button onClick={() => setShowStickers(s=>!s)} className="text-xl px-2 hover:scale-110 transition-transform" title="Stickers">😊</button>
                                    <input value={body} onChange={e=>setBody(e.target.value)} placeholder="Ask anything, share a tip..." className="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-400"
                                        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }}}/>
                                    <button onClick={() => send()} disabled={busy || !body.trim()} className="btn-primary px-4 py-2 rounded-xl text-sm font-semibold disabled:opacity-50">Send</button>
                                </div>
                            </div>
                        ) : (
                            <div className="border-t p-4 text-center text-sm" style={{color:'var(--t3)'}}>Sign in to join the conversation</div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
