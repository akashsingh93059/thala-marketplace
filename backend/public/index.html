<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala — Chennai Street Food, Fruits &amp; Tiffin</title>
    <meta name="description" content="Thala Chennai — discover street food, fresh fruits, tiffin services near you. Book a work-day at a real local shop.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ec4899'/%3E%3Cpath d='M16 44 V24 L32 14 L48 24 V44 H38 V32 H26 V44 Z' fill='%23fff'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        :root {
            --p: #4f46e5; --pd: #4338ca; --pl: #818cf8;
            --a: #f97316; --ad: #ea580c;
            --g: #10b981;
            --bg: #f0f4ff;
            --surf: #ffffff;
            --bdr: #e2e8f0;
            --t1: #0f172a; --t2: #475569; --t3: #94a3b8;
            --sh1: 0 1px 4px rgba(0,0,0,.07);
            --sh2: 0 4px 16px rgba(0,0,0,.1);
            --sh3: 0 16px 48px rgba(0,0,0,.14);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); min-height: 100vh; font-family: 'Inter', -apple-system, sans-serif; color: var(--t1); -webkit-font-smoothing: antialiased; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes spin { to{transform:rotate(360deg)} }
        @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
        @keyframes floatUp { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
        .fade-in { animation: fadeIn .28s ease-out; }
        /* Nav */
        .nav-glass { background: rgba(255,255,255,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226,232,240,.8); }
        /* Hero */
        .hero { position:relative; border-radius:20px; overflow:hidden;
            background: linear-gradient(135deg,#4f46e5 0%,#ec4899 50%,#f97316 100%);
            color:#fff; padding:3rem 2rem 3.5rem; margin-bottom:1.5rem; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.2); }
        .hero::before { content:''; position:absolute; inset:0;
            background: radial-gradient(circle at 12% 20%,rgba(255,255,255,.2) 0%,transparent 42%),
                        radial-gradient(circle at 88% 78%,rgba(255,255,255,.15) 0%,transparent 42%);
            pointer-events:none; }
        .hero-orb { position:absolute; border-radius:50%; background:linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.05)); animation:floatUp 5s ease-in-out infinite alternate; backdrop-filter: blur(4px); box-shadow: 0 8px 32px rgba(255,255,255,0.1); }
        /* Tab bar */
        .tab-bar { display:flex; background:#fff; border-radius:14px; padding:5px; gap:4px; box-shadow:var(--sh1); border:1px solid var(--bdr); width:fit-content; }
        .tab-btn { padding:.55rem 1.4rem; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; transition:all .18s; border:none; background:transparent; color:var(--t2); display:flex; align-items:center; gap:.4rem; white-space:nowrap; }
        .tab-btn.active { background:var(--p); color:#fff; box-shadow:0 3px 10px rgba(79,70,229,.35); }
        .tab-btn:not(.active):hover { background:#f1f5f9; color:var(--t1); }
        /* Cards */
        .card { background:var(--surf); border-radius:16px; box-shadow:var(--sh1); overflow:hidden; transition:transform .22s ease,box-shadow .22s ease; }
        .card:hover { transform:translateY(-5px); box-shadow:var(--sh3); }
        /* Shop image */
        .shop-img { position:relative; overflow:hidden; }
        .shop-img img { width:100%; height:185px; object-fit:cover; transition:transform .32s ease; }
        .card:hover .shop-img img { transform:scale(1.06); }
        .img-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(15,23,42,.65) 0%,transparent 55%); }
        .img-top { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; }
        .img-bottom { position:absolute; bottom:10px; left:10px; right:10px; }
        /* Chips */
        .chip { display:inline-flex; align-items:center; gap:.3rem; padding:.4rem 1rem; border-radius:999px; font-size:.8rem; font-weight:600; cursor:pointer; transition:all .15s; border:2px solid transparent; white-space:nowrap; user-select:none; }
        .chip-off { background:#e0e7ff; color:#3730a3; }
        .chip-off:hover { background:#c7d2fe; }
        .chip-on { background:var(--p); color:#fff; box-shadow:0 3px 10px rgba(79,70,229,.3); }
        /* Buttons */
        .btn-primary { background:var(--p); color:#fff; }
        .btn-primary:hover { background:var(--pd); }
        .btn-accent { background:var(--a); color:#fff; }
        .btn-accent:hover { filter:brightness(.92); }
        /* Stars */
        .star { color:#f59e0b; } .star-empty { color:#d1d5db; }
        /* Online dot */
        .dot-on { width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block; box-shadow:0 0 0 3px rgba(16,185,129,.2); }
        .dot-off { width:8px; height:8px; border-radius:50%; background:#94a3b8; display:inline-block; }
        /* Badge */
        .badge { font-size:.68rem; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
        /* Rating bar */
        .rating-pill { display:inline-flex; align-items:center; gap:.3rem; background:#fef3c7; color:#92400e; padding:.25rem .65rem; border-radius:999px; font-size:.78rem; font-weight:700; }
        /* Spinner */
        .spinner { border:3px solid rgba(79,70,229,.12); border-left-color:var(--p); border-radius:50%; width:26px; height:26px; animation:spin .8s linear infinite; }
        /* Pagination */
        .pagination-btn { background:var(--p); color:#fff; padding:.45rem 1rem; border-radius:8px; font-weight:600; font-size:.85rem; }
        .pagination-btn:disabled { background:#c7d2fe; cursor:not-allowed; }
        /* Chat */
        .chat-drawer { position:fixed; right:1rem; bottom:1rem; width:360px; max-width:calc(100vw - 2rem); height:540px; max-height:calc(100vh - 2rem); background:#fff; border-radius:16px; box-shadow:var(--sh3); display:flex; flex-direction:column; z-index:60; overflow:hidden; border:1px solid var(--bdr); }
        .chat-bubble-me { background:var(--p); color:#fff; border-radius:14px 14px 2px 14px; }
        .chat-bubble-them { background:#f1f5f9; color:var(--t1); border-radius:14px 14px 14px 2px; }
        /* Search */
        .search-box { width:100%; padding:.6rem 1rem .6rem 2.5rem; border:2px solid var(--bdr); border-radius:12px; font-size:.9rem; font-family:inherit; transition:border-color .15s,box-shadow .15s; background:#fff; }
        .search-box:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 3px rgba(79,70,229,.1); }
        /* Misc */
        .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        .section-title { font-size:1.25rem; font-weight:800; color:var(--t1); display:flex; align-items:center; gap:.5rem; margin-bottom:1.25rem; }
        .btn-mba {
            background: linear-gradient(135deg, #f97316, #fb923c);
            animation: mba-glow 2s infinite;
        }
        @keyframes mba-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(249, 115, 22, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const API_BASE = (window.DIVI_API_BASE || (window.location.origin.includes(':5500') ? 'http://localhost:5000' : '')) + '/api';
        const api = axios.create({ baseURL: API_BASE });
        api.interceptors.request.use(cfg => {
            const t = localStorage.getItem('token');
            if (t) cfg.headers.Authorization = `Bearer ${t}`;
            return cfg;
        });
        const errMsg = (err, fallback = 'Something went wrong') =>
            err?.response?.data?.message || err?.response?.data?.errors?.[0]?.msg || err?.message || fallback;

        const Logo = ({ size = 36 }) => (
            <svg width={size} height={size} viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="64" height="64" rx="14" fill="#4f46e5"/>
                <path d="M16 44 V24 L32 14 L48 24 V44 H38 V32 H26 V44 Z" fill="#fff"/>
                <circle cx="48" cy="48" r="8" fill="#f97316" stroke="#fff" strokeWidth="2"/>
            </svg>
        );

        // Site-wide Footer
        function SiteFooter({ config }) {
            const c = config || {};
            return (
                <footer style={{background:'#0f172a',color:'#94a3b8'}} className="mt-12">
                    <div className="container mx-auto px-4 py-10">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mb-8">
                            {/* Brand */}
                            <div>
                                <div className="flex items-center gap-2 mb-3">
                                    <Logo size={32}/>
                                    <span className="text-white font-bold text-lg">Thala</span>
                                </div>
                                <p className="text-sm leading-relaxed">{c.tagline || 'Chennai\'s street food, fruits & tiffin marketplace.'}</p>
                                {c.address && <p className="text-xs mt-3 leading-relaxed">📍 {c.address}</p>}
                            </div>
                            {/* Owner info */}
                            <div>
                                <h4 className="text-white font-semibold mb-3 text-sm uppercase tracking-wider">Owner</h4>
                                {c.ownerName && <p className="text-sm mb-1 font-medium text-white">{c.ownerName}</p>}
                                {c.ownerPhone && <a href={`tel:${c.ownerPhone}`} className="text-sm flex items-center gap-1.5 hover:text-white transition-colors mb-1">📞 {c.ownerPhone}</a>}
                                {c.ownerEmail && <a href={`mailto:${c.ownerEmail}`} className="text-sm flex items-center gap-1.5 hover:text-white transition-colors mb-1">✉️ {c.ownerEmail}</a>}
                                {c.instagram && <a href={`https://instagram.com/${c.instagram.replace('@','')}`} target="_blank" rel="noopener" className="text-sm flex items-center gap-1.5 hover:text-white transition-colors">📸 @{c.instagram.replace('@','')}</a>}
                                {c.facebook && <a href={c.facebook} target="_blank" rel="noopener" className="text-sm flex items-center gap-1.5 hover:text-white transition-colors mt-1">👍 Facebook</a>}
                                {c.youtube && <a href={c.youtube} target="_blank" rel="noopener" className="text-sm flex items-center gap-1.5 hover:text-white transition-colors mt-1">▶ YouTube</a>}
                            </div>
                            {/* Extra sections from admin */}
                            {(c.sections||[]).slice(0,2).map((s,i) => (
                                <div key={i}>
                                    <h4 className="text-white font-semibold mb-3 text-sm uppercase tracking-wider">{s.title}</h4>
                                    <p className="text-sm leading-relaxed whitespace-pre-line">{s.body}</p>
                                </div>
                            ))}
                            {/* Explore */}
                            <div>
                                <h4 className="text-white font-semibold mb-3 text-sm uppercase tracking-wider">Explore</h4>
                                <ul className="space-y-1.5 text-sm">
                                    <li>🍡 Street Food</li>
                                    <li>🥗 Health Freak</li>
                                    <li>🥘 Tiffin Services</li>
                                    <li>🏆 Hall of Fame</li>
                                    <li>🎉 Local Events</li>
                                    <li>💬 Community Chat</li>
                                </ul>
                            </div>
                        </div>
                        <div className="border-t border-white/10 pt-6 flex flex-wrap justify-between items-center gap-3 text-xs">
                            <span>© {new Date().getFullYear()} Thala · Made with ❤️ in Chennai</span>
                            {c.footerNote && <span>{c.footerNote}</span>}
                        </div>
                    </div>
                </footer>
            );
        }

        const Stars = ({ value = 0, max = 5, size = 'sm' }) => {
            const v = Math.round(value);
            const cls = size === 'lg' ? 'text-2xl' : size === 'md' ? 'text-base' : 'text-sm';
            return (
                <span className={cls}>
                    {Array.from({ length: max }).map((_, i) => (
                        <span key={i} className={i < v ? 'star' : 'star-empty'}>★</span>
                    ))}
                </span>
            );
        };

        // ==================== App ====================
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('posts');
            const [view, setView] = useState('main');
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);
            const [loading, setLoading] = useState(false);
            const [showModal, setShowModal] = useState(null); // { type, item? }
            const [refreshKey, setRefreshKey] = useState(0);
            const [chatOpen, setChatOpen] = useState(false);
            const [chatPeer, setChatPeer] = useState(null);
            const [communityOpen, setCommunityOpen] = useState(false);
            const [authMode, setAuthMode] = useState(null);
            const [unreadCount, setUnreadCount] = useState(0);
            const [notifications, setNotifications] = useState([]);
            const [showNotifs, setShowNotifs] = useState(false);
            const unreadNotifs = notifications.filter(n => !n.read).length;

            const markNotifsRead = async () => {
                try {
                    await api.patch('/notifications/read');
                    setNotifications(prev => prev.map(n => ({...n, read: true})));
                } catch {}
            };

            const [areas, setAreas] = useState([]);
            const [staffList, setStaffList] = useState([]);
            const [googleClientId, setGoogleClientId] = useState('');
            const [postCategories, setPostCategories] = useState([]);
            const [shopCategories, setShopCategories] = useState([]);

            const [siteConfig, setSiteConfig] = useState({});

            const isStaff = !!user?.isStaff;
            const isAdmin = !!user?.isAdmin;

            useEffect(() => {
                api.get('/areas').then(r => setAreas(r.data)).catch(() => {});
                api.get('/staff/list').then(r => setStaffList(r.data)).catch(() => {});
                api.get('/auth/config').then(r => setGoogleClientId(r.data.googleClientId || '')).catch(() => {});
                api.get('/categories').then(r => { setPostCategories(r.data.posts || []); setShopCategories(r.data.shops || []); }).catch(() => {});
                api.get('/site-config').then(r => setSiteConfig(r.data || {})).catch(() => {});
            }, []);

            useEffect(() => {
                const token = localStorage.getItem('token');
                if (!token) return;
                setLoading(true);
                api.get('/verify-token')
                    .then(res => setUser(res.data.user))
                    .catch(() => { localStorage.removeItem('token'); setError('Session expired. Please log in again.'); })
                    .finally(() => setLoading(false));
            }, []);

            const handleAuthSuccess = useCallback((token, u) => {
                localStorage.setItem('token', token);
                setUser(u); setError(null); setSuccess(`Welcome, ${u.name}!`);
                // Admin defaults to browse view; employees go to staff dashboard
                if (u.isStaff && !u.isAdmin) setView('staff');
            }, []);

            const handleLogout = useCallback(() => {
                localStorage.removeItem('token');
                setUser(null); setView('main');
                setChatOpen(false); setChatPeer(null); setCommunityOpen(false); setShowNotifs(false);
                setError(null); setSuccess('Logged out');
            }, []);

            const triggerRefresh = useCallback(() => setRefreshKey(k => k + 1), []);

            useEffect(() => {
                if (!success) return;
                const t = setTimeout(() => setSuccess(null), 3500);
                return () => clearTimeout(t);
            }, [success]);

            useEffect(() => {
                if (!user) { setUnreadCount(0); setNotifications([]); return; }
                let cancel = false;
                const tick = async () => {
                    try {
                        const r = await api.get('/messages/threads');
                        if (cancel) return;
                        const total = (r.data || []).reduce((s, t) => s + (t.unread || 0), 0);
                        setUnreadCount(total);
                        const n = await api.get('/notifications');
                        if (cancel) return;
                        setNotifications(n.data || []);
                    } catch {}
                };
                tick();
                const id = setInterval(tick, 8000);
                return () => { cancel = true; clearInterval(id); };
            }, [user]);

            const openChatWith = (peerEmail, opts = {}) => {
                setChatPeer({ email: String(peerEmail).toLowerCase(), ...opts });
                setChatOpen(true);
            };

            const [timePrompt, setTimePrompt] = useState(null);

            useEffect(() => {
                if (!user || user.isStaff) return;
                const check = async () => {
                    if (timePrompt) return; // Don't check if prompt already visible
                    try {
                        const r = await api.get('/user/listings');
                        const shops = r.data.shops || [];
                        const now = new Date();
                        const curTime = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
                        
                        for (const s of shops) {
                            if (s.status !== 'approved') continue;
                            if (s.openAt && s.isOnline === false && curTime >= s.openAt && (!s.closeAt || curTime < s.closeAt)) {
                                setTimePrompt({ shop: s, action: 'open', msg: `It's time! Do you want to open ${s.name} now?` });
                                return;
                            }
                            if (s.closeAt && s.isOnline !== false && curTime >= s.closeAt) {
                                setTimePrompt({ shop: s, action: 'close', msg: `It's closing time! Do you want to close ${s.name} now?` });
                                return;
                            }
                        }
                    } catch {}
                };
                check();
                const id = setInterval(check, 60000);
                return () => clearInterval(id);
            }, [user, timePrompt]);
            
            const handleTimePrompt = async (yes) => {
                const p = timePrompt;
                setTimePrompt(null);
                if (!yes) return;
                setLoading(true);
                try {
                    await api.patch(`/shops/${p.shop._id}/online`, { isOnline: p.action === 'open' });
                    setSuccess(`Shop ${p.shop.name} is now ${p.action === 'open' ? 'Online' : 'Offline'}`);
                    triggerRefresh();
                } catch(err) { setError(errMsg(err)); }
                finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen font-sans antialiased">
                    <header className="nav-glass sticky top-0 z-30">
                        <div className="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                            <button onClick={() => setView('main')} className="flex items-center gap-2 group">
                                <Logo size={36}/>
                                <div className="text-left">
                                    <div className="text-xl font-bold text-indigo-700 leading-none group-hover:text-indigo-900 transition">Thala</div>
                                    <div className="text-xs text-gray-500 -mt-0.5">Chennai street food &amp; tiffin</div>
                                </div>
                            </button>
                            <nav className="flex items-center gap-3 sm:gap-5 flex-wrap text-sm">
                                {user ? (
                                    <>
                                        <span className="text-gray-700 hidden sm:inline">Hi, <span className="font-medium">{user.name}</span>{isStaff && <span className="ml-1 badge bg-orange-500 text-white">{user.role}</span>}</span>
                                        {!isStaff && <button onClick={() => setView('profile')} className="text-indigo-600 hover:text-indigo-900">My Listings</button>}
                                        {isStaff && !isAdmin  && <button onClick={() => setView('staff')}   className="text-indigo-600 hover:text-indigo-900">Staff</button>}
                                        {isAdmin  && <button onClick={() => setView('admin')}   className="text-indigo-600 hover:text-indigo-900">Owner</button>}
                                        {/* Community hidden in shops-focused mode */}
                                        <button onClick={() => setChatOpen(o => !o)} className="relative text-indigo-600 hover:text-indigo-900">
                                            Chat
                                            {unreadCount > 0 && <span className="absolute -top-2 -right-3 bg-orange-500 text-white text-[10px] rounded-full px-1.5 py-0.5 font-bold">{unreadCount}</span>}
                                        </button>
                                        {/* Notification Bell */}
                                        <div className="relative">
                                            <button onClick={() => setShowNotifs(o => !o)} className="relative text-indigo-600 hover:text-indigo-900 px-1 text-lg leading-none">
                                                🔔
                                                {unreadNotifs > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full px-1.5 py-0.5 font-bold">{unreadNotifs}</span>}
                                            </button>
                                            {showNotifs && (
                                                <div className="absolute right-0 mt-2 w-72 max-h-96 overflow-y-auto bg-white rounded-xl shadow-2xl border border-gray-100 z-50 p-2">
                                                    <div className="flex justify-between items-center mb-2 px-2 py-1">
                                                        <h3 className="font-bold text-gray-800 text-sm">Notifications</h3>
                                                        {unreadNotifs > 0 && (
                                                            <button onClick={markNotifsRead} className="text-xs text-indigo-600 hover:underline">Mark all read</button>
                                                        )}
                                                    </div>
                                                    {notifications.length === 0 ? <p className="text-xs text-gray-500 px-2 py-3 text-center">No notifications yet.</p> : (
                                                        <div className="space-y-1">
                                                            {notifications.map(n => (
                                                                <div key={n._id} className={`p-2 rounded text-xs ${!n.read ? 'bg-indigo-50 border-l-2 border-indigo-500' : 'opacity-70'} flex gap-2`}>
                                                                    <div className="text-base">{n.type === 'booking' ? '📅' : n.type === 'like' ? '👍' : n.type === 'reply' ? '💬' : '🔔'}</div>
                                                                    <div className="flex-1">{n.message}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                        <button onClick={handleLogout} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition">Logout</button>
                                    </>
                                ) : (
                                    <>
                                        {/* Community hidden in shops-focused mode */}
                                        <button onClick={() => setAuthMode('login')} className="btn-primary px-4 py-1.5 rounded-md">Sign in</button>

        // ==================== Auth Modal ====================
        function AuthModal({ mode, setMode, onSuccess, setError, onClose, googleClientId }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [pendingCred, setPendingCred] = useState(null);
            const [pendingName, setPendingName] = useState('');
            const [mobile, setMobile] = useState('');
            const [info, setInfo] = useState('');
            const gBtnRef = useRef(null);

            useEffect(() => {
                const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onEsc);
                return () => document.removeEventListener('keydown', onEsc);
            }, [onClose]);

            const handleGoogle = useCallback(async (response, mobileArg) => {
                if (!response?.credential) return;
                setBusy(true); setInfo('');
                try {
                    const r = await api.post('/auth/google', { credential: response.credential, mobile: mobileArg });
                    if (r.data?.needsMobile) {
                        setPendingCred(response.credential);
                        setPendingName(r.data.name || '');
                        setInfo('One more step — your mobile number (private, only DIVI staff sees it).');
                        return;
                    }
                    onSuccess(r.data.token, r.data.user);
                } catch (err) { setError('Google Sign-In failed: ' + errMsg(err)); }
                finally { setBusy(false); }
            }, [onSuccess, setError]);

            useEffect(() => {
                if (pendingCred || !googleClientId) return;
                const id = setInterval(() => {
                    if (window.google?.accounts?.id && gBtnRef.current && gBtnRef.current.childElementCount === 0) {
                        try {
                            window.google.accounts.id.initialize({ client_id: googleClientId, callback: handleGoogle, ux_mode: 'popup' });
                            window.google.accounts.id.renderButton(gBtnRef.current, { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 300 });
                            clearInterval(id);
                        } catch {}
                    }
                }, 300);
                return () => clearInterval(id);
            }, [pendingCred, googleClientId, handleGoogle]);

            const submitMobile = async (e) => {
                e.preventDefault();
                if (!/^[0-9+\-\s]{10,20}$/.test(mobile)) { setError('Enter a valid mobile number'); return; }
                handleGoogle({ credential: pendingCred }, mobile);
            };

            const doLogin = async (e) => {
                e.preventDefault();
                if (busy) return;
                setBusy(true);
                try {
                    const r = await api.post('/login', { email, password });
                    onSuccess(r.data.token, r.data.user);
                } catch (err) { setError('Login failed: ' + errMsg(err)); }
                finally { setBusy(false); }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white p-6 sm:p-8 rounded-xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
                        <div className="flex justify-between items-start mb-4">
                            <h2 className="text-2xl font-bold">{pendingCred ? 'Almost done' : 'Welcome to DIVI'}</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
                        </div>
                        {info && <div className="bg-indigo-50 text-indigo-700 px-3 py-2 rounded mb-4 text-sm">{info}</div>}
                        {pendingCred ? (
                            <form onSubmit={submitMobile} className="space-y-3">
                                <p className="text-sm text-gray-600">Hi {pendingName} — your phone is private. Other users won't see it; only DIVI staff can.</p>
                                <input type="tel" placeholder="Mobile number (10 digits)" value={mobile} onChange={e=>setMobile(e.target.value)} required pattern="[0-9+\-\s]{10,20}" className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                <button type="submit" disabled={busy} className="btn-primary w-full py-2 rounded-md disabled:opacity-60">{busy ? 'Saving...' : 'Continue'}</button>
                            </form>
                        ) : (
                            <>
                                <div className="space-y-3">
                                    {googleClientId ? (
                                        <div className="flex justify-center"><div ref={gBtnRef}/></div>
                                    ) : (
                                        <div className="bg-yellow-50 text-yellow-800 px-3 py-2 rounded text-sm border border-yellow-200">
                                            Google Sign-In not configured. Owner must add <code className="bg-yellow-100 px-1 rounded">GOOGLE_CLIENT_ID</code> in <code className="bg-yellow-100 px-1 rounded">backend/.env</code>.
                                        </div>
                                    )}
                                    <p className="text-center text-xs text-gray-500">— or —</p>
                                </div>
                                <form onSubmit={doLogin} className="space-y-3 mt-2">
                                    <p className="text-xs text-gray-500">Staff &amp; existing users — sign in with email &amp; password:</p>
                                    <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                    <input type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} required className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                                    <button type="submit" disabled={busy} className="bg-gray-700 hover:bg-gray-800 text-white w-full py-2 rounded-md disabled:opacity-60">{busy ? 'Signing in...' : 'Login with email'}</button>
                                </form>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function ShopsFetcher({ area, onSelectShop }) {

        function usePagedList(endpoint, params, refreshKey, setError) {
            const [data, setData] = useState([]);
            const [page, setPage] = useState(1);
            const [total, setTotal] = useState(0);
            const [pages, setPages] = useState(1);
            const [loading, setLoading] = useState(false);
            const paramsKey = JSON.stringify(params);
            useEffect(() => { setPage(1); }, [paramsKey]);
            useEffect(() => {
                let cancelled = false;
                setLoading(true);
                api.get(endpoint, { params: { ...params, page } })
                    .then(res => {
                        if (cancelled) return;
                        const p = res.data;
                        if (Array.isArray(p)) { setData(p); setTotal(p.length); setPages(1); }
                        else { setData(p.data || []); setTotal(p.total || 0); setPages(p.totalPages || 1); }
                    })
                    .catch(err => { if (!cancelled) setError(`Error: ` + errMsg(err)); })
                    .finally(() => { if (!cancelled) setLoading(false); });
                return () => { cancelled = true; };
            }, [endpoint, paramsKey, page, refreshKey]);
            return { data, page, setPage, total, pages, loading };
        }

        // ==================== Leaflet map picker ====================
        function MapPicker({ lat, lng, onChange }) {
            const ref = useRef(null);
            const mapRef = useRef(null);
            const markerRef = useRef(null);
            useEffect(() => {
                if (!ref.current || !window.L) return;
                if (!mapRef.current) {
                    const center = [lat || 13.0827, lng || 80.2707]; // Chennai default
                    const m = window.L.map(ref.current).setView(center, lat ? 16 : 12);
                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap', maxZoom: 19,
                    }).addTo(m);
                    const marker = window.L.marker(center, { draggable: true }).addTo(m);
                    marker.on('dragend', () => {
                        const p = marker.getLatLng();
                        onChange(p.lat, p.lng);
                    });
                    m.on('click', (e) => {
                        marker.setLatLng(e.latlng);
                        onChange(e.latlng.lat, e.latlng.lng);
                    });
                    mapRef.current = m;
                    markerRef.current = marker;
                }
                return () => { /* keep map between renders */ };
            }, []); // eslint-disable-line
            useEffect(() => {
                if (markerRef.current && lat != null && lng != null) {
                    markerRef.current.setLatLng([lat, lng]);
                }
            }, [lat, lng]);
            return (
                <div>
                    <div ref={ref} style={{ height: 300, borderRadius: 8, border: '1px solid #d1d5db' }}/>
                    <p className="text-xs text-gray-500 mt-1">Click or drag the marker to set the exact shop location.</p>
                    <p className="text-xs text-gray-500">Lat: {lat?.toFixed(5) || '—'} · Lng: {lng?.toFixed(5) || '—'}</p>
                </div>
            );
        }

        // ==================== Static map (read-only) ====================
        function MapView({ lat, lng, name }) {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || !window.L || lat == null || lng == null) return;
                const m = window.L.map(ref.current, { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false }).setView([lat, lng], 16);
                window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxZoom: 19 }).addTo(m);
                window.L.marker([lat, lng]).addTo(m).bindPopup(name || '').openPopup();
                return () => m.remove();
            }, [lat, lng]);
            if (lat == null || lng == null) return null;
            return <div ref={ref} style={{ height: 200, borderRadius: 8, border: '1px solid #d1d5db' }}/>;
        }
