services:
  - type: web
    name: thala-marketplace
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        description: "MongoDB Atlas Connection String"
      - key: CLOUDINARY_URL
        description: "Cloudinary API Environment Variable"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
